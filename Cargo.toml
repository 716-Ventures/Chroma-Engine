[package]
name = "chroma-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
license = "Proprietary"
description = "Native Rust media engine for Chroma playback, probing, packet planning, remuxing, and transcoding."

[lib]
name = "chroma_engine"
path = "src/lib.rs"

[[bin]]
name = "chroma-engine"
path = "src/bin/chroma-engine.rs"

[dependencies]
anyhow = "1.0"
bitflags = "2.6"
bytes = "1.7"
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
assert_cmd = "2.0"
insta = { version = "1.40", features = ["json"] }
tempfile = "3.12"
