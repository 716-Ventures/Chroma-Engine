[package]
name = "chroma-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Proprietary"
description = "Native Rust media engine for Chroma playback, probing, packet planning, remuxing, and transcoding."
repository = "https://github.com/716-Ventures/Chroma-Engine"
readme = "README.md"
publish = false
keywords = ["media", "playback", "hls", "mp4", "matroska"]
categories = ["multimedia::video", "multimedia::audio", "parser-implementations"]

[lib]
name = "chroma_engine"
path = "src/lib.rs"

[[bin]]
name = "chroma-engine"
path = "src/bin/chroma-engine.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dav1d = "0.11.1"
memmap2 = "0.9"
openh264 = "0.9.8"
oxideav-ac3 = "0.0.11"
oxideav-core = "0.1.35"
oxideav-dts = { version = "=0.0.1", git = "https://github.com/OxideAV/oxideav-dts.git", rev = "951b4221969b742b1b330149106931f8be416d47", default-features = false }
opus-pure = "=0.2.0"
rusty_aac = { version = "0.5.0", default-features = false }
rust_h265 = "0.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.12"
thiserror = "1.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
truehd = "0.7.1"

[features]
default = []
fuzzing = []
linux-nvidia = ["dep:oxideav-nvidia"]
linux-vaapi = ["dep:nuxodecs"]

[dev-dependencies]
assert_cmd = "2.0"
criterion = "0.7"
insta = { version = "1.40", features = ["json"] }
proptest = "1.9"

[[bench]]
name = "engine_hot_paths"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# `truehd` contains very large generated tables. Optimizing that dependency causes rustc to exceed
# the memory available on common NAS-class ARM builders without improving the surrounding engine.
[profile.release.package.truehd]
opt-level = 0

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[target.'cfg(target_os = "macos")'.dependencies]
audiotoolbox = "0.4.0"
block2 = "0.6.2"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-video-toolbox = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
# VA-API is optional at runtime. Loading it dynamically keeps Linux/NAS
# binaries buildable and runnable on hosts without graphics development files.
libloading = "0.8.9"
nuxodecs = { version = "0.1.2", optional = true, default-features = false, features = ["h265", "vaapi"] }
oxideav-nvidia = { version = "=0.0.3", path = "third_party/oxideav-nvidia", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
mediaway-common = { version = "=0.1.4", git = "https://github.com/nyxways/mediaway.git", rev = "ad056ebf139a624a024016727030365eca9cfa08" }
mediaway-decoder = { version = "=0.1.4", path = "third_party/mediaway-decoder", default-features = false, features = ["video"] }
mediaway-encoder = { version = "=0.1.4", git = "https://github.com/nyxways/mediaway.git", rev = "ad056ebf139a624a024016727030365eca9cfa08", default-features = false, features = ["video"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }
