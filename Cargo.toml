[package]
name = "chroma-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Proprietary"
description = "Native Rust media engine for Chroma playback, probing, packet planning, remuxing, and transcoding."
repository = "https://github.com/716-Ventures/Chroma-Engine"
readme = "README.md"
publish = false
keywords = ["media", "playback", "hls", "mp4", "matroska"]
categories = ["multimedia::video", "multimedia::audio", "parser-implementations"]

[lib]
name = "chroma_engine"
path = "src/lib.rs"

[[bin]]
name = "chroma-engine"
path = "src/bin/chroma-engine.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
openh264 = "0.9.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.12"
thiserror = "1.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
default = []
fuzzing = []

[dev-dependencies]
assert_cmd = "2.0"
criterion = "0.7"
insta = { version = "1.40", features = ["json"] }
proptest = "1.9"

[[bench]]
name = "engine_hot_paths"
harness = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[target.'cfg(target_os = "macos")'.dependencies]
audiotoolbox = "0.4.0"
block2 = "0.6.2"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-video-toolbox = "0.3.2"
