name: Set up dav1d
description: Install the native dav1d development library used by dav1d-rs

runs:
  using: composite
  steps:
    - name: Install dav1d on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew list dav1d >/dev/null 2>&1 || brew install dav1d
        echo "PKG_CONFIG_PATH=$(brew --prefix dav1d)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

    - name: Install dav1d on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes libdav1d-dev

    - name: Install dav1d on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install pkgconfiglite --yes --no-progress
        $triplet = if ($env:RUNNER_ARCH -eq "ARM64") { "arm64-windows" } else { "x64-windows" }
        & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "dav1d:$triplet"
        $installed = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/$triplet"
        "PKG_CONFIG_PATH=$(Join-Path $installed 'lib/pkgconfig')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        (Join-Path $installed "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Verify dav1d
      shell: bash
      run: pkg-config --modversion dav1d
