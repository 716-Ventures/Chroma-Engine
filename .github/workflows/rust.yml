name: Rust

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        toolchain: ["1.90.0", "1.97.1"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy,rustfmt
      - name: Native AV1 decoder
        uses: ./.github/actions/setup-dav1d
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Format
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == '1.97.1'
        run: cargo fmt --check
      - name: Check all features
        run: cargo check --locked --all-targets --all-features
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Docs
        if: matrix.toolchain == '1.97.1'
        run: cargo doc --locked --no-deps --all-features

  security:
    name: Security and dependency hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.97.1"
      - name: Native AV1 decoder
        uses: ./.github/actions/setup-dav1d
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: security-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Dependency audit
        run: cargo deny check
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked --version 0.9.1
      - name: Unused dependency check
        run: cargo machete
      - name: Future incompatibility report
        run: cargo check --locked --future-incompat-report

  fuzz-smoke:
    name: Fuzz target smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Rust nightly
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly
      - name: Native AV1 decoder
        uses: ./.github/actions/setup-dav1d
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fuzz-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.toml') }}
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Compile fuzz targets
        run: cargo +nightly check --manifest-path fuzz/Cargo.toml
      - name: Smoke fuzz containers
        run: cargo +nightly fuzz run containers -- -runs=1
      - name: Smoke fuzz codecs
        run: cargo +nightly fuzz run codecs -- -runs=1
      - name: Smoke fuzz subtitles
        run: cargo +nightly fuzz run subtitles -- -runs=1
      - name: Smoke fuzz fmp4
        run: cargo +nightly fuzz run fmp4 -- -runs=1

  release-build:
    name: Auditable release build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.97.1"
      - name: Native AV1 decoder
        uses: ./.github/actions/setup-dav1d
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked --version 0.7.5
      - name: Build auditable binary
        env:
          RUSTFLAGS: -A linker-messages
        run: cargo auditable build --locked --release --bin chroma-engine
      - name: Prepare release bundle
        shell: bash
        run: |
          mkdir -p dist/chroma-engine
          cp README.md THIRD_PARTY_NOTICES.md dist/chroma-engine/
      - name: Bundle macOS runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/chroma-engine
          cp target/release/chroma-engine dist/chroma-engine/
          dav1d_lib="$(brew --prefix dav1d)/lib/libdav1d.7.dylib"
          cp "$dav1d_lib" dist/chroma-engine/
          install_name_tool -change "$dav1d_lib" '@loader_path/libdav1d.7.dylib' dist/chroma-engine/chroma-engine
          install_name_tool -id '@loader_path/libdav1d.7.dylib' dist/chroma-engine/libdav1d.7.dylib
          codesign --force --sign - dist/chroma-engine/libdav1d.7.dylib
          codesign --force --sign - dist/chroma-engine/chroma-engine
      - name: Bundle Linux runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/chroma-engine
          cp target/release/chroma-engine dist/chroma-engine/
          dav1d_lib="$(ldconfig -p | awk '/libdav1d\.so\.7/{print $NF; exit}')"
          test -n "$dav1d_lib"
          cp "$dav1d_lib" dist/chroma-engine/libdav1d.so.7
          patchelf --set-rpath '$ORIGIN' dist/chroma-engine/chroma-engine
      - name: Bundle Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $triplet = if ($env:RUNNER_ARCH -eq "ARM64") { "arm64-windows" } else { "x64-windows" }
          $bundle = New-Item -ItemType Directory -Force dist/chroma-engine
          Copy-Item target/release/chroma-engine.exe $bundle
          $dav1d = Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT/installed/$triplet/bin" -Filter "dav1d.dll" | Select-Object -First 1
          if (-not $dav1d) { throw "vcpkg dav1d runtime DLL was not found" }
          Copy-Item $dav1d.FullName $bundle
      - name: Smoke bundled Unix runtime
        if: runner.os != 'Windows'
        shell: bash
        run: dist/chroma-engine/chroma-engine decoder-probe
      - name: Smoke bundled Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: dist/chroma-engine/chroma-engine.exe decoder-probe
      - name: Upload portable release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chroma-engine-${{ runner.os }}-${{ runner.arch }}
          path: dist/chroma-engine
          if-no-files-found: error

  portable-arm64:
    name: Portable ARM64 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.90.0"
      - name: Native AV1 decoder
        uses: ./.github/actions/setup-dav1d
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: arm64-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Check portable build
        run: cargo check --locked --all-targets --all-features
      - name: Test portable CPU codec
        run: cargo test --locked --all-features cpu_h264
      - name: Build release binary
        run: cargo build --locked --release --bin chroma-engine
