name: Rust

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  test:
    name: ${{ matrix.os }} / Rust ${{ matrix.toolchain }}
    env:
      # Match the native Homebrew libraries shipped by the macOS 15 runners.
      MACOSX_DEPLOYMENT_TARGET: "15.5"
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, windows-latest]
        toolchain: ["1.90.0", "1.97.1"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy,rustfmt
      - name: Verify active compiler
        run: rustc --version --verbose
      - name: Native AV1 decoder
        uses: ./.github/actions/setup-dav1d
      - name: Linux VA-API build headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libva-dev
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.toolchain }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Format
        if: matrix.os == 'ubuntu-latest' && matrix.toolchain == '1.97.1'
        run: cargo fmt --check
      - name: Check all features
        run: cargo check --locked --all-targets --all-features
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Release source-mutation and retained-session regressions
        if: matrix.toolchain == '1.90.0'
        run: cargo test --locked --release --test stability
      - name: Generated native-session smoke
        shell: bash
        run: |
          cargo run --locked --example make-test-media -- synthetic.mkv 6
          cargo run --locked --bin chroma-engine -- transcode-fmp4-segments synthetic.mkv smoke-output --start-index 0 --count 2 --video-mode copy
      - name: Docs
        if: matrix.toolchain == '1.97.1'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

  security:
    name: Security and dependency hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.97.1"
      - name: Verify active compiler
        run: rustc --version --verbose
      - name: Native AV1 decoder
        uses: ./.github/actions/setup-dav1d
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: security-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Dependency audit
        run: cargo deny check
      - name: Install license inventory tool
        run: cargo install cargo-about --locked --version 0.9.2 --features cli
      - name: Verify dependency license inventory
        run: |
          python3 scripts/test-check-licenses.py
          python3 scripts/check-licenses.py
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked --version 0.9.1
      - name: Unused dependency check
        run: cargo machete
      - name: Future incompatibility report
        run: cargo check --locked --future-incompat-report

  fuzz-smoke:
    name: Fuzz target smoke
    env:
      RUSTUP_TOOLCHAIN: nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Rust nightly
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly
      - name: Verify active compiler
        run: rustc --version --verbose
      - name: Native AV1 decoder
        uses: ./.github/actions/setup-dav1d
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fuzz-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.toml') }}
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Compile fuzz targets
        run: cargo +nightly check --locked --manifest-path fuzz/Cargo.toml
      - name: Seed container and fragment fuzzers with valid synthetic structure
        run: |
          mkdir -p fuzz/corpus/containers fuzz/corpus/fmp4
          cargo +nightly run --locked --example make-test-media -- fuzz/corpus/containers/generated.mkv 6
          cargo +nightly run --locked --bin chroma-engine -- transcode-fmp4-segments fuzz/corpus/containers/generated.mkv fuzz/corpus/fmp4 --start-index 0 --count 2 --video-mode copy
      - name: Smoke fuzz containers
        run: cargo +nightly fuzz run containers -- -max_total_time=60 -timeout=10 -rss_limit_mb=512
      - name: Smoke fuzz codecs
        run: cargo +nightly fuzz run codecs -- -max_total_time=60 -timeout=10 -rss_limit_mb=512
      - name: Smoke fuzz subtitles
        run: cargo +nightly fuzz run subtitles -- -max_total_time=60 -timeout=10 -rss_limit_mb=512
      - name: Smoke fuzz fmp4
        run: cargo +nightly fuzz run fmp4 -- -max_total_time=60 -timeout=10 -rss_limit_mb=512

  release-build:
    name: Auditable release build / ${{ matrix.os }}
    env:
      # Release artifacts require macOS 15.5 or later, including native codecs.
      MACOSX_DEPLOYMENT_TARGET: "15.5"
    needs: security
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            features: ""
          - os: macos-15-intel
            features: ""
          - os: ubuntu-latest
            features: "--features linux-vaapi,linux-nvidia"
          - os: windows-latest
            features: ""
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.97.1"
      - name: Verify active compiler
        run: rustc --version --verbose
      - name: Native AV1 decoder
        uses: ./.github/actions/setup-dav1d
      - name: Linux VA-API build headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libva-dev
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v2-release-${{ runner.os }}-${{ runner.arch }}-1.97.1-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked --version 0.7.5
      - name: Build auditable binary
        env:
          RUSTFLAGS: -A linker-messages
        run: cargo auditable build --locked --release --bin chroma-engine ${{ matrix.features }}
      - name: Prepare release bundle
        shell: bash
        run: |
          mkdir -p dist/chroma-engine
          cp LICENSE README.md THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md dist/chroma-engine/
          cp packaging/license-fallbacks.json dist/chroma-engine/
          cp third_party/rusty_aac/LICENSE dist/chroma-engine/rusty-aac-LICENSE
      - name: Bundle macOS runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/chroma-engine
          cp target/release/chroma-engine dist/chroma-engine/
          dav1d_lib="$(brew --prefix dav1d)/lib/libdav1d.7.dylib"
          cp "$dav1d_lib" dist/chroma-engine/
          install_name_tool -change "$dav1d_lib" '@loader_path/libdav1d.7.dylib' dist/chroma-engine/chroma-engine
          install_name_tool -id '@loader_path/libdav1d.7.dylib' dist/chroma-engine/libdav1d.7.dylib
          codesign --force --sign - dist/chroma-engine/libdav1d.7.dylib
          codesign --force --sign - dist/chroma-engine/chroma-engine
      - name: Bundle Linux runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist/chroma-engine
          cp target/release/chroma-engine dist/chroma-engine/
          dav1d_lib="$(ldconfig -p | awk '/libdav1d\.so\.7/{print $NF; exit}')"
          test -n "$dav1d_lib"
          cp "$dav1d_lib" dist/chroma-engine/libdav1d.so.7
          patchelf --set-rpath '$ORIGIN' dist/chroma-engine/chroma-engine
      - name: Bundle Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $triplet = if ($env:RUNNER_ARCH -eq "ARM64") { "arm64-windows" } else { "x64-windows" }
          $bundle = New-Item -ItemType Directory -Force dist/chroma-engine
          Copy-Item target/release/chroma-engine.exe $bundle
          $dav1d = Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT/installed/$triplet/bin" -Filter "dav1d.dll" | Select-Object -First 1
          if (-not $dav1d) { throw "vcpkg dav1d runtime DLL was not found" }
          Copy-Item $dav1d.FullName $bundle
      - name: Smoke bundled Unix runtime
        if: runner.os != 'Windows'
        shell: bash
        run: dist/chroma-engine/chroma-engine decoder-probe
      - name: Smoke bundled Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: dist/chroma-engine/chroma-engine.exe decoder-probe
      - name: Archive Unix release bundle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="chroma-engine-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz"
          tar -C dist -czf "dist/$archive" chroma-engine
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 "dist/$archive" > "dist/$archive.sha256"
          else
            sha256sum "dist/$archive" > "dist/$archive.sha256"
          fi
      - name: Archive Windows release bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "chroma-engine-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
          Compress-Archive -Path dist/chroma-engine -DestinationPath "dist/$archive"
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Out-File "dist/$archive.sha256" -Encoding ascii
      - name: Verify Unix release checksum
        if: runner.os != 'Windows'
        shell: bash
        run: |
          checksum="chroma-engine-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz.sha256"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 -c "dist/$checksum"
          else
            sha256sum -c "dist/$checksum"
          fi
      - name: Verify Windows release checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "chroma-engine-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
          $expected = (Get-Content "dist/$archive.sha256").Split()[0]
          $actual = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "release archive checksum verification failed" }
      - name: Upload portable release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chroma-engine-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/chroma-engine-${{ runner.os }}-${{ runner.arch }}.*
          if-no-files-found: error

  portable-arm64:
    name: Portable ARM64 / ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: "1.90.0"
    needs: security
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: "1.90.0"
      - name: Verify active compiler
        run: rustc --version --verbose
      - name: Native AV1 decoder
        uses: ./.github/actions/setup-dav1d
      - name: Linux VA-API build headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libva-dev
      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v2-arm64-${{ runner.os }}-${{ runner.arch }}-1.90.0-${{ hashFiles('**/Cargo.lock') }}
      - name: Check portable build
        run: cargo check --locked --all-targets --all-features
      - name: Test complete portable suite
        run: cargo test --locked --all-features
      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked --version 0.7.5
      - name: Build auditable Linux ARM64 release binary
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: -A linker-messages
        run: cargo auditable build --locked --release --features linux-vaapi --bin chroma-engine
      - name: Build auditable Windows ARM64 release binary
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: -A linker-messages
        run: cargo auditable build --locked --release --bin chroma-engine
      - name: Prepare ARM64 release bundle
        shell: bash
        run: |
          mkdir -p dist/chroma-engine
          cp LICENSE README.md THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md dist/chroma-engine/
          cp packaging/license-fallbacks.json dist/chroma-engine/
          cp third_party/rusty_aac/LICENSE dist/chroma-engine/rusty-aac-LICENSE
      - name: Bundle Linux ARM64 runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cp target/release/chroma-engine dist/chroma-engine/
          dav1d_lib="$(ldconfig -p | awk '/libdav1d\.so\.7/{print $NF; exit}')"
          test -n "$dav1d_lib"
          cp "$dav1d_lib" dist/chroma-engine/libdav1d.so.7
          patchelf --set-rpath '$ORIGIN' dist/chroma-engine/chroma-engine
      - name: Bundle Windows ARM64 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = Get-Item dist/chroma-engine
          Copy-Item target/release/chroma-engine.exe $bundle
          $dav1d = Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT/installed/arm64-windows/bin" -Filter "dav1d.dll" | Select-Object -First 1
          if (-not $dav1d) { throw "vcpkg dav1d ARM64 runtime DLL was not found" }
          Copy-Item $dav1d.FullName $bundle
      - name: Smoke bundled Linux ARM64 runtime
        if: runner.os == 'Linux'
        shell: bash
        run: dist/chroma-engine/chroma-engine decoder-probe
      - name: Smoke bundled Windows ARM64 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: dist/chroma-engine/chroma-engine.exe decoder-probe
      - name: Archive Linux ARM64 release bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive="chroma-engine-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz"
          tar -C dist -czf "dist/$archive" chroma-engine
          sha256sum "dist/$archive" > "dist/$archive.sha256"
      - name: Archive Windows ARM64 release bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "chroma-engine-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
          Compress-Archive -Path dist/chroma-engine -DestinationPath "dist/$archive"
          $hash = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Out-File "dist/$archive.sha256" -Encoding ascii
      - name: Verify Linux ARM64 release checksum
        if: runner.os == 'Linux'
        shell: bash
        run: sha256sum -c "dist/chroma-engine-${RUNNER_OS}-${RUNNER_ARCH}.tar.gz.sha256"
      - name: Verify Windows ARM64 release checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "chroma-engine-$env:RUNNER_OS-$env:RUNNER_ARCH.zip"
          $expected = (Get-Content "dist/$archive.sha256").Split()[0]
          $actual = (Get-FileHash "dist/$archive" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "release archive checksum verification failed" }
      - name: Upload ARM64 release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chroma-engine-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/chroma-engine-${{ runner.os }}-${{ runner.arch }}.*
          if-no-files-found: error

  linux-nas-baseline:
    name: NAS glibc 2.36 bundle / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build and execute in Debian 12 without graphics devices
        run: docker build --target baseline-test -f packaging/Dockerfile.linux -t chroma-nas-baseline .
      - name: Exercise actual worker under the small-NAS memory ceiling
        run: |
          docker run --rm --memory=512m --cpus=2 --network=none -e CHROMA_RESOURCE_POLICY=small-nas chroma-nas-baseline /runtime/chroma-engine transcode-fmp4-segments /fixture.mkv /tmp/segments --start-index 0 --count 2 --video-mode copy
      - name: Export baseline-specific bundle
        run: docker build --output type=local,dest=dist/nas-glibc236 -f packaging/Dockerfile.linux .
      - name: Upload baseline bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chroma-engine-Linux-${{ runner.arch }}-glibc236
          path: dist/nas-glibc236/
          if-no-files-found: error
