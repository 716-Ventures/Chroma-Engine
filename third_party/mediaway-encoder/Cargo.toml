[package]
name = "mediaway-encoder"
description = "Hardware-accelerated video/audio encoding (OS-native backends)"
version = "0.1.4"
publish = true # hardware-verified — see docs/roadmap.md
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nyxways/mediaway"
authors = ["NyxWays"]


[dependencies]
mediaway-common = { version = "0.1", git = "https://github.com/nyxways/mediaway.git", rev = "ad056ebf139a624a024016727030365eca9cfa08" }
thiserror = { version = "2.0" }


mediaway-sw = { version = "0.1", git = "https://github.com/nyxways/mediaway.git", rev = "ad056ebf139a624a024016727030365eca9cfa08" }


# Vulkan bindings. `libloading` dynamically resolves the system Vulkan loader at
# runtime — never a build-time link requirement. See adr/0001 (2026-07-29


# oneVPL bindings only on Windows this stage: this crate must stay buildable
# (as an honest `Unsupported` stub) on non-Windows hosts running
# `cargo check --workspace` without pulling in `vpl-sys`'s `bindgen`/`libclang`
# build step. Mirrors `mediaway-encoder-linux`'s `[target.'cfg(target_os = "linux")'.dependencies]`.
iso-bmff = { version = "0.1.1", git = "https://github.com/nyxways/mediaway.git", rev = "ad056ebf139a624a024016727030365eca9cfa08", features = ["full"] }
bytes = { version = "1.10" }
wasm-bindgen = { version = "0.2" }
wasm-bindgen-futures = { version = "0.4" }


[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Vulkan Video bindings — desktop only; libloading is not wasm32-compatible.
vulkanalia = { version = "0.35", default-features = false, features = ["std", "libloading"] }




[lib]
# Chroma consumes the Rust library only. A simultaneous cdylib output gives
# abort/unwind release-test builds the same rlib filename, causing collisions.
crate-type = ["rlib"]

[dev-dependencies]
mediaway-container = { version = "0.1", git = "https://github.com/nyxways/mediaway.git", rev = "ad056ebf139a624a024016727030365eca9cfa08", features = ["full"] }
criterion = { version = "0.7" }


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
vpl-sys = { version = "0.1", git = "https://github.com/nyxways/mediaway.git", rev = "ad056ebf139a624a024016727030365eca9cfa08" }


[target.'cfg(target_os = "linux")'.dependencies]
cros-libva = { version = "0.0.13" }


[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4" }
js-sys = { version = "0.3" }
web-sys = { version = "0.3", features = [
    "AudioData",
    "AudioDataInit",
    "AudioSampleFormat",
    "AudioEncoder",
    "AudioEncoderConfig",
    "AudioEncoderInit",
    "AudioEncoderSupport",
    "EncodedAudioChunk",
    "EncodedVideoChunk",
    "EncodedVideoChunkType",
    "EncodedVideoChunkMetadata",
    "VideoDecoderConfig",
    "VideoEncoder",
    "VideoEncoderConfig",
    "VideoEncoderInit",
    "VideoEncoderSupport",
    "VideoFrame",
    "VideoFrameBufferInit",
    "VideoFrameInit",
    "VideoPixelFormat",
    "Window",
    "Navigator",
    # WebGPU — GPUTexture-backed canvas source for `VideoFrame` (Stage 2 GPU path).
    # `web_sys_unstable_apis` is already set for wasm32 in `.cargo/config.toml`.
    "Gpu",
    "GpuAdapter",
    "GpuDevice",
    "GpuQueue",
    "GpuCanvasContext",
    "GpuCanvasConfiguration",
    "GpuCanvasAlphaMode",
    "GpuTextureFormat",
    "GpuTexture",
    "GpuTextureView",
    "GpuCommandEncoder",
    "GpuCommandBuffer",
    "GpuRenderPassEncoder",
    "GpuRenderPassDescriptor",
    "GpuRenderPassColorAttachment",
    "GpuColorDict",
    "GpuLoadOp",
    "GpuStoreOp",
    "OffscreenCanvas",
] }


[features]
default = ["full", "video"]
audio = []
video = []
full = ["audio", "video"]

[target.'cfg(all(windows, any(target_arch = "x86", target_arch = "x86_64")))'.dependencies]
nvenc = "0.1"
