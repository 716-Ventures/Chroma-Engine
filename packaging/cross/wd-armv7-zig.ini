# Cross-build dav1d for the measured WD My Cloud EX2 Ultra OS 5 ABI.
# The NAS is ARM EABI5 hard-float with /lib/ld-linux-armhf.so.3.
# This file configures only the C library build; the full Rust binaries still
# require separate cross-linking and physical load tests.

[binaries]
c = ['zig', 'cc', '-target', 'arm-linux-gnueabihf.2.31']
cpp = ['zig', 'c++', '-target', 'arm-linux-gnueabihf.2.31']
ar = ['zig', 'ar']
pkg-config = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'

[properties]
needs_exe_wrapper = true
