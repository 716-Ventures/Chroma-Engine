[package]
name = "chroma-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
chroma-engine = { path = "..", features = ["fuzzing"] }
libfuzzer-sys = "0.4"

# This is a separate Cargo root and does not inherit the engine's profiles.
# Keep the same memory workaround for truehd's large generated tables here.
[profile.release.package.truehd]
opt-level = 0

[[bin]]
name = "containers"
path = "fuzz_targets/containers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codecs"
path = "fuzz_targets/codecs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "subtitles"
path = "fuzz_targets/subtitles.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fmp4"
path = "fuzz_targets/fmp4.rs"
test = false
doc = false
bench = false
